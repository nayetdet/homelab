apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirro-world
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nayetdet/mirro-world.git
    targetRevision: main
    path: k8s/mirro-world
  destination:
    server: https://kubernetes.default.svc
    namespace: mirro-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
