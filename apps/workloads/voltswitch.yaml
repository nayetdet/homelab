apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voltswitch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/nayetdet/homelab.git
    targetRevision: main
    path: charts/workloads/voltswitch
  destination:
    server: https://kubernetes.default.svc
    namespace: voltswitch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
