apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/nayetdet/charts
    chart: gatekeeper
    targetRevision: "*"
    helm:
      parameters:
        - name: secret.enabled
          value: "false"
        - name: externalSecret.enabled
          value: "true"
        - name: externalSecret.storeName
          value: vault
        - name: filebrowser.enabled
          value: "true"
        - name: filebrowser.ingress.main.enabled
          value: "true"
        - name: filebrowser.ingress.main.hosts[0].host
          value: gatekeeper.home.arpa
        - name: filebrowser.ingress.main.hosts[0].paths[0].path
          value: /
        - name: filebrowser.ingress.main.hosts[0].paths[0].pathType
          value: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
