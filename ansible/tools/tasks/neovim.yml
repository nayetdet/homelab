---
- name: Install Neovim and dependencies
  ansible.builtin.apt:
    name:
      - curl
      - fd-find
      - git
      - neovim
      - ripgrep
      - unzip
    state: present
    update_cache: true

- name: Clone or update LazyVim starter configuration
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter.git
    dest: "/home/{{ tools_user }}/.config/nvim"
    version: main
    depth: 1
  become_user: "{{ tools_user }}"

- name: Configure Neovim line numbers
  ansible.builtin.copy:
    dest: "/home/{{ tools_user }}/.config/nvim/lua/config/options.lua"
    content: |
      vim.opt.number = true
      vim.opt.relativenumber = false
    owner: "{{ tools_user }}"
    group: "{{ tools_user }}"
    mode: "0644"

- name: Configure Neovim Carbonfox colorscheme
  ansible.builtin.copy:
    dest: "/home/{{ tools_user }}/.config/nvim/lua/plugins/colorscheme.lua"
    content: |
      return {
        {
          "EdenEast/nightfox.nvim",
          priority = 1000,
          config = function()
            vim.cmd.colorscheme("carbonfox")
          end,
        },
      }
    owner: "{{ tools_user }}"
    group: "{{ tools_user }}"
    mode: "0644"
