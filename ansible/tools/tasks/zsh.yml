---
- name: Install Zsh and Git
  ansible.builtin.apt:
    name:
      - git
      - zsh
    state: present
    update_cache: true

- name: Clone or update Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ ansible_user }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become_user: "{{ ansible_user }}"

- name: Customize the Zsh theme prompt color
  ansible.builtin.replace:
    path: "/home/{{ ansible_user }}/.oh-my-zsh/themes/{{ tools_zsh_theme }}.zsh-theme"
    regexp: "%F\\{green\\}%n@"
    replace: "%F{yellow}%n@"
  become_user: "{{ ansible_user }}"

- name: Install Zsh Completions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-completions.git
    dest: "/home/{{ ansible_user }}/.oh-my-zsh/custom/plugins/zsh-completions"
    version: master
    depth: 1
  become_user: "{{ ansible_user }}"

- name: Install Zsh Autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "/home/{{ ansible_user }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: master
    depth: 1
  become_user: "{{ ansible_user }}"

- name: Install Zsh Syntax Highlighting
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "/home/{{ ansible_user }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    version: master
    depth: 1
  become_user: "{{ ansible_user }}"

- name: Configure Oh My Zsh in .zshrc
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_user }}/.zshrc"
    create: true
    marker: "# {mark} ANSIBLE MANAGED OH-MY-ZSH"
    content: |
      export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"
      export ZSH="/home/{{ ansible_user }}/.oh-my-zsh"
      ZSH_THEME="{{ tools_zsh_theme }}"
      zstyle ':omz:update' mode auto
      zstyle ':omz:update' frequency 7
      plugins=(git zsh-completions zsh-autosuggestions zsh-syntax-highlighting)
      source $ZSH/oh-my-zsh.sh
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Set Zsh as the default shell
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
