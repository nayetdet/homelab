---
# handlers file for networking
- name: Reload UFW
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted
