---
- name: Enable and start SSH
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Configure SSH Hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication yes
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
  notify: Restart SSH
