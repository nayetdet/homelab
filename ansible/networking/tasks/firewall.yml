---
- name: Install UFW firewall
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    lock_timeout: 300

- name: Disable IPv6 rules in UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPV6='
    line: IPV6=no
  notify: Reload UFW

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH from the internal network
  community.general.ufw:
    rule: allow
    port: "{{ networking_ssh_port }}"
    proto: tcp
    src: "{{ networking_internal_network }}"

- name: Allow DNS from the internal network
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
    src: "{{ networking_internal_network }}"
  loop:
    - tcp
    - udp

- name: Allow HTTP and HTTPS ingress
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ networking_internal_network }}"
  loop:
    - "80"
    - "443"

- name: Allow K3s API from the internal network
  community.general.ufw:
    rule: allow
    port: "{{ networking_k3s_api_port }}"
    proto: tcp
    src: "{{ networking_internal_network }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
