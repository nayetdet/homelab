---
- name: Install K3s prerequisite
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    lock_timeout: 300

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure an independent K3s upstream resolver
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/upstream-resolv.conf
    content: |
      {% for dns_server in kubernetes_k3s_upstream_dns_servers %}
      nameserver {{ dns_server }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Restart K3s

- name: Configure K3s resolver
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      resolv-conf: /etc/rancher/k3s/upstream-resolv.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart K3s

- name: Install K3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 0644
  args:
    creates: /etc/systemd/system/k3s.service
    executable: /bin/bash
  register: k3s_install
  retries: 5
  delay: 10
  until: k3s_install.rc == 0
  notify: Restart K3s

- name: Enable and start K3s
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Create kubectl configuration directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: ansible_user != 'root'

- name: Copy K3s kubeconfig to the Ansible user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ansible_user != 'root'
