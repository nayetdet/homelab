---
- name: Install K3s prerequisite
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    lock_timeout: 300

- name: Install K3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 0644
  args:
    creates: /etc/systemd/system/k3s.service
    executable: /bin/bash
  register: k3s_install
  retries: 5
  delay: 10
  until: k3s_install.rc == 0
  notify: Restart K3s

- name: Configure Traefik to redirect HTTP to HTTPS
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          additionalArguments:
            - --entryPoints.web.http.redirections.entryPoint.to=:443
            - --entryPoints.web.http.redirections.entryPoint.scheme=https
            - --entryPoints.web.http.redirections.entryPoint.permanent=true
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Enable and start K3s
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Create kubectl configuration directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: ansible_user != 'root'

- name: Copy K3s kubeconfig to the Ansible user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ansible_user != 'root'
