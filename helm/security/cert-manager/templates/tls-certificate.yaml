apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-arpa
  namespace: {{ .Release.Namespace }}
spec:
  secretName: home-arpa-tls
  commonName: home.arpa
  dnsNames:
    - home.arpa
    - "*.home.arpa"
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
    group: cert-manager.io
