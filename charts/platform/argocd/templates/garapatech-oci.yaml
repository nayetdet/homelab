apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garapatech-oci
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-oci
    kind: ClusterSecretStore
  target:
    name: garapatech-oci
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: helm
        url: ghcr.io/garapatech/charts
        enableOCI: "true"
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: nayetdet
        property: username
    - secretKey: password
      remoteRef:
        key: nayetdet
        property: password
