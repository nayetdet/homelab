vault:
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: home-ca
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: vault.home.arpa
          paths:
            - /
      tls:
        - secretName: vault-tls
          hosts:
            - vault.home.arpa

  ui:
    enabled: true
